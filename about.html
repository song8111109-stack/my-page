    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>나를 소개한다</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&amp;family=Neo+Dunggeunmo&amp;display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-color: #0f081d;
            --container-bg: #1a0f35;
            --text-color: #00ffcc;
            --text-secondary: #ff77a8;
            --accent-yellow: #ffe600;
            --card-bg: #2d1b4e;
            --border-color: #00ffcc;
            --shadow-color: #008080;
            --box-shadow: 4px 4px 0px #000;
            --font-pixel: 'Neo Dunggeunmo', 'Press Start 2P', monospace;
        }

        /* 라이트 모드 변수 */
        body.light-mode {
            --bg-color: #f0f3f8;
            --container-bg: #ffffff;
            --text-color: #2b1055;
            --text-secondary: #ff1493;
            --accent-yellow: #ff9900;
            --card-bg: #e6e9ff;
            --border-color: #2b1055;
            --shadow-color: #8892b0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: var(--font-pixel);
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
            position: relative;
        }

        /* 레트로 CRT 화면 스캔라인 효과 */
        body::after {
            content: " ";
            display: block;
            position: fixed;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%);
            background-size: 100% 4px;
            z-index: 999;
            pointer-events: none;
            opacity: 0.6;
        }

        /* 픽셀 스타일 컨테이너 */
        .arcade-box {
            width: 100%;
            max-width: 700px;
            background-color: var(--container-bg);
            border: 4px solid var(--border-color);
            box-shadow: 8px 8px 0px var(--shadow-color);
            border-radius: 4px;
            padding: 24px 16px;
            margin-bottom: 24px;
            position: relative;
        }

        /* 헤더 & 다크모드 토글 */
        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 700px;
            margin-bottom: 15px;
        }

        .theme-btn {
            background: var(--accent-yellow);
            color: #000;
            border: 3px solid #000;
            padding: 8px 12px;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            font-weight: bold;
        }
        .theme-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }

        /* 통통 튀는 별명 타이틀 */
        .title-container {
            text-align: center;
            margin: 20px 0 30px 0;
        }

        .bounce-title {
            display: inline-block;
            font-size: 2.2rem;
            color: var(--accent-yellow);
            text-shadow: 4px 4px 0px #ff0055, -2px -2px 0px #000;
            letter-spacing: 2px;
        }

        .bounce-title span {
            display: inline-block;
            animation: bounce 0.6s ease infinite alternate;
        }

        /* 글자별 애니메이션 딜레이 설정 */
        .bounce-title span:nth-child(1) { animation-delay: 0.0s; }
        .bounce-title span:nth-child(2) { animation-delay: 0.1s; }
        .bounce-title span:nth-child(3) { animation-delay: 0.2s; }
        .bounce-title span:nth-child(4) { animation-delay: 0.3s; }

        @keyframes bounce {
            0% { transform: translateY(0); }
            100% { transform: translateY(-18px); }
        }

        .subtitle {
            font-size: 1rem;
            color: var(--text-secondary);
            margin-top: 10px;
            text-align: center;
        }

        /* 섹션 제목 */
        .section-title {
            font-size: 1.3rem;
            margin-bottom: 15px;
            color: var(--accent-yellow);
            display: flex;
            align-items: center;
            gap: 8px;
            border-bottom: 3px dashed var(--border-color);
            padding-bottom: 8px;
        }

        /* 방문자 이름 입력 */
        .visitor-section {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        .pixel-input {
            flex: 1;
            padding: 10px;
            background: #000;
            color: #00ffcc;
            border: 3px solid var(--border-color);
            font-size: 1rem;
            outline: none;
        }
        .pixel-btn {
            background: #ff0055;
            color: #fff;
            border: 3px solid #000;
            padding: 10px 16px;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 3px 3px 0px #000;
            font-weight: bold;
            transition: transform 0.1s;
        }
        .pixel-btn:active {
            transform: translate(2px, 2px);
            box-shadow: 1px 1px 0px #000;
        }
        .welcome-msg {
            margin-top: 10px;
            font-size: 1.1rem;
            color: var(--text-color);
            min-height: 1.5em;
            word-break: break-all;
        }

        /* 카드 뒤집기 섹션 (좋아하는 것 3가지) */
        .cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .flip-card {
            background-color: transparent;
            height: 200px;
            perspective: 1000px;
            cursor: pointer;
        }

        .flip-card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }

        .flip-card.flipped .flip-card-inner {
            transform: rotateY(180deg);
        }

        .flip-card-front, .flip-card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border: 3px solid var(--border-color);
            box-shadow: 4px 4px 0px #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 12px;
            border-radius: 4px;
        }

        .flip-card-front {
            background-color: var(--card-bg);
            color: var(--accent-yellow);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .card-click-hint {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 8px;
            animation: pulse 1s infinite alternate;
        }

        @keyframes pulse {
            from { opacity: 0.5; }
            to { opacity: 1; }
        }

        .flip-card-back {
            background-color: var(--accent-yellow);
            color: #000;
            transform: rotateY(180deg);
            font-size: 0.95rem;
            line-height: 1.4;
            font-weight: bold;
        }

        /* OX 퀴즈 섹션 */
        .quiz-container {
            text-align: center;
        }
        .quiz-question {
            font-size: 1.1rem;
            margin-bottom: 20px;
            background: #000;
            padding: 15px;
            border: 2px solid var(--border-color);
            color: #fff;
            border-radius: 4px;
        }
        .quiz-btns {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
        }
        .btn-o, .btn-x {
            width: 80px;
            height: 60px;
            font-size: 1.8rem;
        }
        .btn-o { background: #00cc66; }
        .btn-x { background: #ff3333; }

        .quiz-result {
            font-size: 1.1rem;
            min-height: 40px;
            padding: 8px;
            font-weight: bold;
        }

        /* 명언 자판기 */
        .quote-box {
            background: #000;
            border: 3px solid var(--border-color);
            padding: 20px;
            margin-bottom: 15px;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: #fff;
            font-size: 1rem;
            line-height: 1.5;
        }

        /* 광클 미니게임 */
        .game-area {
            text-align: center;
        }
        .game-stats {
            display: flex;
            justify-content: space-around;
            font-size: 1.2rem;
            margin-bottom: 15px;
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 4px;
        }
        .click-btn {
            width: 100%;
            max-width: 280px;
            height: 90px;
            font-size: 1.5rem;
            background: var(--accent-yellow);
            color: #000;
            border: 4px solid #000;
            box-shadow: 6px 6px 0px #000;
            cursor: pointer;
            margin: 10px 0;
        }
        .click-btn:active {
            transform: translate(3px, 3px);
            box-shadow: 3px 3px 0px #000;
        }

        /* 풋터 */
        footer {
            margin-top: 10px;
            margin-bottom: 30px;
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: center;
        }

        /* 마우스 파티클 (반짝이) */
        .sparkle {
            position: fixed;
            width: 8px;
            height: 8px;
            background-color: var(--accent-yellow);
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 0 6px var(--accent-yellow);
            animation: sparkleFade 0.6s forwards linear;
        }

        @keyframes sparkleFade {
            0% { transform: scale(1) rotate(0deg); opacity: 1; }
            100% { transform: scale(0) rotate(180deg); opacity: 0; }
        }

        /* 모바일 대응 레이아웃 */
        @media (max-width: 600px) {
            .bounce-title {
                font-size: 1.6rem;
            }
            .arcade-box {
                padding: 16px 12px;
            }
            .cards-grid {
                grid-template-columns: 1fr;
            }
            .flip-card {
                height: 160px;
            }
        }
    </style>
